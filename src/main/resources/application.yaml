spring:
  application:
    name: portfolio-v1-backend
  # Basic認証設定
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:user}
      password: ${SPRING_SECURITY_USER_PASSWORD:password}
  # jsonの出力をきれいにする
  Jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS
    time-zone: Asia/Tokyo
    serialization:
      indent-output: true
  # DB設定
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio-v1-backend}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  # JPAのログ設定
  jpa:
    hibernate:
      ddl-auto: validate
  # flyway設定
  flyway:
    enabled: true
  # AWS 設定
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}
      region:
        static: ${AWS_REGION:ap-northeast-1}
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME}
      presigned-url-duration-minutes: ${AWS_S3_PRESIGNED_URL_DURATION_MINUTES:5}

# サーバー設定
server:
  port: 8080
  servlet:
    context-path: /  # APIの先頭URLを指定したい場合はここを変える
  forward-headers-strategy: FRAMEWORK
  error:
    include-message: never
    include-stacktrace: never

# ログ設定
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG # SQLをログに出す
    com.example.demo: DEBUG  # 自分の書いたコードのログを出す

# swaggerの設定
springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operationsSorter: method

# メール 設定
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    provider: ${APP_MAIL_PROVIDER:local}
    from-address: ${APP_MAIL_FROM_ADDRESS:}
    admin-address: ${APP_MAIL_ADMIN_ADDRESS:}
  jwt-secret: ${APP_JWT_SECRET}
